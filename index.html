<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化工吨桶 IBC 1000L · 三维模型</title>
<style>
  :root { --ink:#1b2430; --accent:#0e62d6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#e9edf2; }
  body { font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif; color:var(--ink); }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  .card { position:fixed; background:rgba(255,255,255,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
          border:1px solid rgba(255,255,255,.65); box-shadow:0 8px 28px rgba(20,35,60,.12); border-radius:14px; }

  #title { top:18px; left:18px; padding:14px 18px; max-width:340px; }
  #title h1 { font-size:17px; font-weight:700; letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
  #title h1 .dot { width:9px; height:9px; border-radius:3px; background:var(--accent); box-shadow:0 0 0 4px rgba(14,98,214,.15); }
  #title p { font-size:11.5px; color:#5a6b80; margin-top:5px; letter-spacing:.3px; }

  #panel { top:18px; right:18px; padding:12px; width:196px; }
  #panel .row { display:flex; gap:8px; margin-bottom:8px; }
  #panel .row:last-child { margin-bottom:0; }
  #panel .cap { font-size:10.5px; color:#8393a8; letter-spacing:2px; margin:2px 2px 8px; }
  button { flex:1; border:1px solid rgba(120,140,170,.35); background:rgba(255,255,255,.85); color:#2a3950;
           font-size:12px; padding:7px 6px; border-radius:9px; cursor:pointer; transition:all .15s; font-family:inherit; }
  button:hover { background:#fff; border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #exportBtn { background:#123c2f; color:#eaf6f0; border-color:#123c2f; font-weight:600; letter-spacing:1px; }
  #exportBtn:hover { background:#186a4c; color:#fff; }
  #status { font-size:11px; color:#3f8f65; text-align:center; margin-top:8px; height:14px; }

  #spec { bottom:18px; left:18px; padding:10px 16px; font-size:11.5px; color:#42536b; letter-spacing:.4px; }
  #spec b { color:#16222f; font-weight:600; }
  #hint { position:fixed; bottom:20px; right:22px; font-size:11px; color:#8b99ac; letter-spacing:1px; }
  @media (max-width:720px){ #panel{width:150px} #title{max-width:250px} #spec{display:none} }
</style>
</head>
<body>
<div id="app"></div>

<div class="card" id="title">
  <h1><span class="dot"></span>化工吨桶 IBC-1000L</h1>
  <p>复合中型散装容器 · HDPE 内胆 + 镀锌钢框架 · UN 31H1</p>
</div>

<div class="card" id="panel">
  <div class="cap">显示</div>
  <div class="row">
    <button id="btnRotate" class="on">自动旋转</button>
    <button id="btnWire">线框</button>
  </div>
  <div class="cap" style="margin-top:10px">视角</div>
  <div class="row">
    <button id="vHero" class="on">透视</button>

    <button id="vTop">顶部</button>
  </div>

  <div id="status"></div>
</div>

<div class="card" id="spec">
  外形 <b>1200 × 1000 × 1160 mm</b> · 内容积 <b>1000 L</b> · 自重 <b>≈ 62 kg</b> · 桶口 <b>DN150</b> · 放料阀 <b>DN50</b>
</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ================= 场景 ================= */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// 渐变背景
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#cfd9e4'); gr.addColorStop(.45,'#e7ecf2'); gr.addColorStop(1,'#f7f9fb');
  g.fillStyle = gr; g.fillRect(0,0,4,512);
  const bg = new THREE.CanvasTexture(c); bg.colorSpace = THREE.SRGBColorSpace;
  scene.background = bg;
}

const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.1, 60);
camera.position.set(2.35, 1.52, 3.15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.60, 0);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 1.6; controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = true; controls.autoRotateSpeed = 1.0;

// 环境光照
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(2.6, 4.6, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left=-1.7; key.shadow.camera.right=1.7;
key.shadow.camera.top=1.9;  key.shadow.camera.bottom=-1.9;
key.shadow.camera.near=1;   key.shadow.camera.far=12;
key.shadow.bias = -0.00018; key.shadow.normalBias = 0.02; key.shadow.radius = 5;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.55); fill.position.set(-3, 2.2, -0.5); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffffff, 0.7);  rim.position.set(-1.6, 3.0, -3.6); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

/* ================= 材质 ================= */
function noiseRoughTex(base=0.30, vary=0.22, size=256){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d'), img=g.createImageData(size,size), d=img.data;
  let s=12345; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  for(let i=0;i<d.length;i+=4){ const v=(base+rnd()*vary)*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3); return t;
}
const MAT = {
  galv:  new THREE.MeshStandardMaterial({ color:0xb7c1c9, metalness:0.88, roughness:0.36, roughnessMap:noiseRoughTex(0.3,0.25), envMapIntensity:1.1 }),
  galvDark: new THREE.MeshStandardMaterial({ color:0x99a3ab, metalness:0.85, roughness:0.44, roughnessMap:noiseRoughTex(0.36,0.3), envMapIntensity:0.9 }),
  hdpe:  new THREE.MeshPhysicalMaterial({ color:0xf4f5f0, metalness:0, roughness:0.46, clearcoat:0.08, clearcoatRoughness:0.6, envMapIntensity:0.5 }),
  black: new THREE.MeshStandardMaterial({ color:0x17181b, metalness:0.15, roughness:0.42, envMapIntensity:0.6 }),
  valve: new THREE.MeshStandardMaterial({ color:0x39404a, metalness:0.75, roughness:0.38, envMapIntensity:0.95 }),
  red:   new THREE.MeshStandardMaterial({ color:0xc22a24, metalness:0.12, roughness:0.5, envMapIntensity:0.6 }),
  darkIn:new THREE.MeshStandardMaterial({ color:0x2b2f34, metalness:0.4, roughness:0.8 }),
};

/* ================= 标签贴图 ================= */
function makeLabelTexture(){
  const W=760, H=560, c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#f8f8f4'; g.fillRect(0,0,W,H);
  g.strokeStyle='#c9cdd2'; g.lineWidth=3; g.strokeRect(14,14,W-28,H-28);
  // 顶部色带
  g.fillStyle='#0e62d6'; g.fillRect(14,14,W-28,74);
  g.fillStyle='#fff'; g.font='700 40px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('IBC 吨桶 · 1000 L', 40, 66);
  // 菱形危险标志
  const cx=W-140, cy=150, r=88;
  g.save(); g.translate(cx,cy); g.rotate(Math.PI/4);
  g.fillStyle='#f5821f'; g.fillRect(-r*0.72,-r*0.72,r*1.44,r*1.44);
  g.strokeStyle='#222'; g.lineWidth=5; g.strokeRect(-r*0.72,-r*0.72,r*1.44,r*1.44);
  g.restore();
  g.fillStyle='#111'; g.font='700 44px sans-serif'; g.textAlign='center';
  g.fillText('3', cx, cy+16); g.textAlign='left';
  // 参数
  g.fillStyle='#1a2430'; g.font='600 34px "PingFang SC",sans-serif';
  g.fillText('UN 31H1 / Y1.8 / 150', 44, 160);
  g.font='27px "PingFang SC",sans-serif'; g.fillStyle='#435062';
  const lines=[
    '内容器：HDPE 高密度聚乙烯',
    '外框架：热镀锌钢管 · 钢制托盘',
    '外形尺寸：1200 × 1000 × 1160 mm',
    '自重 ≈ 62 kg    满载 ≈ 1062 kg',
    '灌装口 DN150 · 放料阀 DN50 球阀',
    '最大堆码：3 层 · 适用非危/III类包装'
  ];
  lines.forEach((t,i)=> g.fillText(t, 44, 224 + i*44));
  // 条码
  let x=44; g.fillStyle='#111';
  const bar=()=>{ for(let i=0;i<46;i++){ const w=(i%3===0)?6:(i%3===1?2.5:4); if(i%2===0) g.fillRect(x, H-92, w, 56); x+=w+2.5; } };
  bar();
  g.font='22px monospace'; g.fillStyle='#333';
  g.fillText('CN 31H1 1000L 2026', x+26, H-54);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=8; return t;
}

/* ================= 工具 ================= */
const tote = new THREE.Group(); tote.name='IBC_Tote_1000L';
function add(geo, mat, x,y,z, opts={}){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true;
  if(opts.ry) m.rotation.y=opts.ry;
  if(opts.rx) m.rotation.x=opts.rx;
  if(opts.rz) m.rotation.z=opts.rz;
  if(opts.name) m.name=opts.name;
  tote.add(m); return m;
}
// 两点间圆管
function tube(a, b, r, mat, seg=10){
  const v1=new THREE.Vector3(...a), v2=new THREE.Vector3(...b);
  const len=v1.distanceTo(v2);
  const geo=new THREE.CylinderGeometry(r,r,len,seg);
  const m=new THREE.Mesh(geo,mat);
  m.position.copy(v1).add(v2).multiplyScalar(0.5);
  const dir=v2.clone().sub(v1).normalize();
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  m.castShadow=true; m.receiveShadow=true; tote.add(m); return m;
}
const box=(w,h,d,r=0.006)=> r>0 ? new RoundedBoxGeometry(w,h,d,3,r) : new THREE.BoxGeometry(w,h,d);

/* ================= 尺寸（米） ================= */
const D = {
  palletL:1.20, palletW:1.00, palletH:0.14,
  cageL:1.16, cageW:0.96, postS:0.042,
  cageTop:1.17,
  vR:0.0115,           // 竖管半径
  railR:0.0155,        // 横杆半径
  bottleL:1.06, bottleW:0.86, bottleH:0.96, bottleY:0.14,
};
const hx = D.cageL/2, hz = D.cageW/2;          // 框架半宽 0.58 / 0.48
const px = hx - D.postS/2, pz = hz - D.postS/2; // 立柱中心 0.559 / 0.459

/* ---- 1. 钢托盘 ---- */
{
  const g = new THREE.Group(); g.name='Pallet';
  // 顶板
  add(box(1.20, 0.035, 1.00, 0.012), MAT.galvDark, 0, 0.1225, 0, {name:'pallet_top'});
  // 侧墙（长边 z=±）
  add(box(1.20, 0.105, 0.09, 0.008), MAT.galvDark, 0, 0.0525,  0.455);
  add(box(1.20, 0.105, 0.09, 0.008), MAT.galvDark, 0, 0.0525, -0.455);
  // 端部大块（x=±）
  add(box(0.16, 0.105, 0.82, 0.008), MAT.galvDark,  0.52, 0.0525, 0);
  add(box(0.16, 0.105, 0.82, 0.008), MAT.galvDark, -0.52, 0.0525, 0);
  // 叉车孔隔墙（沿 z 走向的隧道，x=±0.19 / ±0.43）
  for(const x of [-0.43,-0.19,0.19,0.43]) add(box(0.05,0.105,0.82,0.006), MAT.galvDark, x, 0.0525, 0);
  // 叉孔内衬暗色（增强深度感）
  add(box(0.22,0.085,0.80,0), MAT.darkIn,  0.31, 0.053, 0);
  add(box(0.22,0.085,0.80,0), MAT.darkIn, -0.31, 0.053, 0);
  // 立柱底座垫板
  for(const sx of [-1,1]) for(const sz of [-1,1])
    add(box(0.075,0.016,0.075,0.005), MAT.galv, sx*px, 0.148, sz*pz);
}

/* ---- 2. 镀锌钢管框架 ---- */
{
  const yBot = 0.155, yTop = D.cageTop;
  // 四角立柱
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    add(box(D.postS, yTop-0.148, D.postS, 0.008), MAT.galv, sx*px, (0.148+yTop)/2+0.003, sz*pz, {name:'post'});
    // 柱顶盖板 + 底部螺栓
    add(box(D.postS+0.012, 0.012, D.postS+0.012, 0.004), MAT.galv, sx*px, yTop+0.006, sz*pz);
    const bolt = new THREE.CylinderGeometry(0.008,0.008,0.014,8);
    add(bolt, MAT.black, sx*px, 0.162, sz*pz);
  }
  // 周圈横杆高度（避开放料阀区 y≈0.235）
  const rails = [0.34, 0.58, 0.82, 1.04];
  const vx = 0.469; // 竖管所在面 z
  for(const y of rails){
    // 长边（z=±）完整横杆（阀门高度 0.18~0.30 已避开首层横杆 0.34）
    tube([-px,y,vx],[px,y,vx], D.railR, MAT.galv);
    tube([-px,y,-vx],[px,y,-vx], D.railR, MAT.galv);
    // 短边（x=±）
    tube([hx-0.011,y,-vx],[hx-0.011,y,vx], D.railR, MAT.galv);
    tube([-hx+0.011,y,-vx],[-hx+0.011,y,vx], D.railR, MAT.galv);
  }
  // 顶部围框 + 横撑
  tube([-px,yTop,vx],[px,yTop,vx], D.railR, MAT.galv);
  tube([-px,yTop,-vx],[px,yTop,-vx], D.railR, MAT.galv);
  tube([hx-0.011,yTop,-vx],[hx-0.011,yTop,vx], D.railR, MAT.galv);
  tube([-hx+0.011,yTop,-vx],[-hx+0.011,yTop,vx], D.railR, MAT.galv);
  tube([-0.33,yTop,-vx],[-0.33,yTop,vx], D.railR, MAT.galv);
  tube([ 0.33,yTop,-vx],[ 0.33,yTop,vx], D.railR, MAT.galv);
  // 竖向钢管（四立面网格）
  for(let i=-5;i<=5;i++){ const x=i*0.10;
    if(Math.abs(x)>px-0.03) continue;
    tube([x,yBot,-vx],[x,yTop,-vx], D.vR, MAT.galv);          // -z 面
    if(!(Math.abs(x-0.35)<0.09))                              // +z 面避开阀门
      tube([x,yBot,vx],[x,yTop,vx], D.vR, MAT.galv);
  }
  for(let i=-4;i<=4;i++){ const z=i*0.105;
    if(Math.abs(z)>pz-0.05) continue;
    tube([ px+0.005,yBot,z],[ px+0.005,yTop,z], D.vR, MAT.galv); // +x 面
    tube([-px-0.005,yBot,z],[-px-0.005,yTop,z], D.vR, MAT.galv); // -x 面
  }
}

/* ---- 3. HDPE 内胆 ---- */
{
  const g = new THREE.Group(); g.name='Bottle';
  const bw = add(new RoundedBoxGeometry(D.bottleL, D.bottleH, D.bottleW, 5, 0.055), MAT.hdpe,
                 0, D.bottleY + D.bottleH/2, 0, {name:'bottle_body'});
  // 灌装口 DN150
  add(new THREE.CylinderGeometry(0.105,0.115,0.045,28), MAT.hdpe, -0.16, 1.123, 0.06, {name:'fill_neck'});
  add(new THREE.CylinderGeometry(0.100,0.100,0.020,32), MAT.black, -0.16, 1.148, 0.06, {name:'cap_base'});
  const knurl = add(new THREE.CylinderGeometry(0.096,0.096,0.026,28), MAT.black, -0.16, 1.171, 0.06);
  knurl.geometry.computeVertexNormals();
  add(new THREE.CylinderGeometry(0.082,0.090,0.010,28), MAT.black, -0.16, 1.189, 0.06);
  // 呼吸/取样口 DN50
  add(new THREE.CylinderGeometry(0.050,0.058,0.040,24), MAT.hdpe, 0.30, 1.118, 0.20);
  add(new THREE.CylinderGeometry(0.046,0.046,0.024,24), MAT.black, 0.30, 1.148, 0.20);
  add(new THREE.CylinderGeometry(0.020,0.020,0.014,16), MAT.red, 0.30, 1.164, 0.20);
  // 底部放料口凸台（内部暗托效果）
  add(box(0.18,0.02,0.03,0.008), MAT.galvDark, 0.35, 0.155, 0.425);
}

/* ---- 4. DN50 放料阀 ---- */
{
  const g = new THREE.Group(); g.name='Valve';
  const X=0.35, Y=0.235, Z0=0.43;
  // 出料法兰座（贴瓶面）
  add(new THREE.CylinderGeometry(0.062,0.068,0.022,26), MAT.valve, X, Y, Z0+0.011, {rx:Math.PI/2});
  add(new THREE.CylinderGeometry(0.040,0.040,0.048,20), MAT.valve, X, Y, Z0+0.046, {rx:Math.PI/2});
  // 阀体 + 两道法兰环
  add(box(0.105,0.115,0.075,0.02), MAT.valve, X, Y, Z0+0.105, {name:'valve_body'});
  add(new THREE.CylinderGeometry(0.055,0.055,0.014,24), MAT.galv, X, Y, Z0+0.075, {rx:Math.PI/2});
  add(new THREE.CylinderGeometry(0.055,0.055,0.014,24), MAT.galv, X, Y, Z0+0.135, {rx:Math.PI/2});
  // 红色手柄（沿 +x 侧向）
  add(box(0.17,0.013,0.022,0.005), MAT.red, X+0.105, Y+0.062, Z0+0.105, {name:'handle'});
  add(box(0.05,0.02,0.026,0.008), MAT.black, X+0.20, Y+0.062, Z0+0.105);
  // 出口直管（沿 +z）→ 90° 弯肘 → 竖直向下
  add(new THREE.CylinderGeometry(0.032,0.032,0.06,18), MAT.valve, X, Y, Z0+0.160, {rx:Math.PI/2});
  const R=0.042;
  const elbow = new THREE.TorusGeometry(R,0.030,12,18,Math.PI/2);
  add(elbow, MAT.valve, X, Y-R, Z0+0.145+R, {ry:-Math.PI/2}, );
  add(new THREE.CylinderGeometry(0.030,0.030,0.105,18), MAT.valve, X, Y-R-0.0525+R, Z0+0.145+2*R);
  add(new THREE.CylinderGeometry(0.036,0.036,0.015,18), MAT.galv, X, 0.112, Z0+0.145+2*R);
}
/* ---- 5. 危险品标签 ---- */
{
  const tex = makeLabelTexture();
  const labelMat = new THREE.MeshStandardMaterial({ map:tex, roughness:0.55, metalness:0, envMapIntensity:0.4,
    polygonOffset:true, polygonOffsetFactor:-1 });
  const label = new THREE.Mesh(new THREE.PlaneGeometry(0.62,0.455), labelMat);
  label.position.set(-0.02, 0.74, 0.4338); label.rotation.y=0; label.name='label'; label.castShadow=false;
  tote.add(label);
  const label2 = label.clone(); label2.rotation.y=Math.PI; label2.position.z=-0.4338;
  tote.add(label2);
}

scene.add(tote);
tote.position.y = 0.001;

/* ================= 地面 ================= */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30,30), new THREE.ShadowMaterial({ opacity:0.24 }));
ground.rotation.x = -Math.PI/2; ground.position.y=0; ground.receiveShadow=true; scene.add(ground);
// 接触 AO 渐变
{
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(128,128,20,128,128,126);
  gr.addColorStop(0,'rgba(30,42,60,0.34)'); gr.addColorStop(.55,'rgba(30,42,60,0.12)'); gr.addColorStop(1,'rgba(30,42,60,0)');
  g.fillStyle=gr; g.fillRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c);
  const ao=new THREE.Mesh(new THREE.PlaneGeometry(3.4,3.0), new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));
  ao.rotation.x=-Math.PI/2; ao.position.y=0.002; scene.add(ao);
}

/* ================= 视角预设 & 交互 ================= */
const views = {
  hero:  { pos:[2.35,1.52,3.15], tgt:[0,0.60,0] },
  front: { pos:[0.001,0.85,3.45], tgt:[0,0.60,0] },
  side:  { pos:[3.45,0.85,0.55], tgt:[0,0.60,0] },
  top:   { pos:[0.55,4.35,0.75], tgt:[0,0.35,0] },
};
let tween=null;
function goView(name){
  const v=views[name]; if(!v) return;
  tween={ t:0, p0:camera.position.clone(), p1:new THREE.Vector3(...v.pos),
          q0:controls.target.clone(), q1:new THREE.Vector3(...v.tgt) };
}
const viewBtns={vHero:'hero',vFront:'front',vSide:'side',vTop:'top'};
for(const [id,name] of Object.entries(viewBtns)){
  document.getElementById(id).onclick=()=>{
    document.querySelectorAll('#panel button').forEach(b=>b.classList.remove('on'));
    document.getElementById(id).classList.add('on');
    goView(name);
  };
}
document.getElementById('btnRotate').onclick=(e)=>{
  controls.autoRotate=!controls.autoRotate;
  e.target.classList.toggle('on',controls.autoRotate);
};
let wire=false;
document.getElementById('btnWire').onclick=(e)=>{
  wire=!wire; e.target.classList.toggle('on',wire);
  tote.traverse(o=>{ if(o.isMesh && o.material && !o.material.map) o.material.wireframe=wire; });
};
const status=document.getElementById('status');
document.getElementById('exportBtn').onclick=()=>{
  status.textContent='正在生成 GLB…';
  const ex=new GLTFExporter();
  ex.parse(tote,(buf)=>{
    const blob=new Blob([buf],{type:'model/gltf-binary'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='IBC-Tote-1000L.glb';
    a.click(); URL.revokeObjectURL(a.href);
    status.textContent='✓ 已导出 GLB';
    setTimeout(()=>status.textContent='',2600);
  },(err)=>{ status.textContent='导出失败'; console.error(err); },{binary:true});
};

/* ================= 渲染循环 ================= */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  if(tween){
    tween.t=Math.min(1,tween.t+dt/0.85);
    const k=1-Math.pow(1-tween.t,3);
    camera.position.lerpVectors(tween.p0,tween.p1,k);
    controls.target.lerpVectors(tween.q0,tween.q1,k);
    if(tween.t>=1) tween=null;
  }
  controls.update();
  renderer.render(scene,camera);
}
animate();
window.__dbg={THREE,tote,scene,camera,renderer};
window.__modelReady=true;

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
