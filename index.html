<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>化工设备三维模型库 · Chemical Equipment 3D Library</title>
<style>
  :root { --ink:#1b2430; --accent:#0e62d6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#e9edf2; }
  body { font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif; color:var(--ink); }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .card { position:fixed; background:rgba(255,255,255,.74); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
          border:1px solid rgba(255,255,255,.65); box-shadow:0 8px 28px rgba(20,35,60,.12); border-radius:14px; }
  #title { top:16px; left:16px; padding:12px 16px; z-index:10; }
  #title h1 { font-size:16px; font-weight:700; letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
  #title h1 .dot { width:9px; height:9px; border-radius:3px; background:var(--accent); box-shadow:0 0 0 4px rgba(14,98,214,.15); }
  #title p { font-size:11px; color:#5a6b80; margin-top:4px; letter-spacing:.3px; }
  #nav { top:16px; left:16px; margin-top:64px; padding:10px; width:172px; z-index:9; }
  #nav button { display:flex; width:100%; text-align:left; margin-bottom:6px; padding:9px 10px; border-radius:10px;
    border:1px solid transparent; background:transparent; font-size:12.5px; justify-content:space-between; align-items:center; }
  #nav button small { color:#8b99ac; font-size:10px; }
  #nav button:hover { background:rgba(14,98,214,.06); }
  #nav button.on { background:var(--accent); color:#fff; }
  #nav button.on small { color:rgba(255,255,255,.7); }
  #panel { top:16px; right:16px; padding:12px; width:190px; z-index:10; }
  #panel .row { display:flex; gap:8px; margin-bottom:8px; }
  #panel .cap { font-size:10.5px; color:#8393a8; letter-spacing:2px; margin:2px 2px 8px; }
  button.act, a.btn { flex:1; border:1px solid rgba(120,140,170,.35); background:rgba(255,255,255,.85); color:#2a3950;
           font-size:12px; padding:7px 6px; border-radius:9px; cursor:pointer; transition:all .15s; font-family:inherit; text-align:center; text-decoration:none; }
  button.act:hover, a.btn:hover { background:#fff; border-color:var(--accent); color:var(--accent); }
  button.act.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #exportBtn { background:#123c2f; color:#eaf6f0; border-color:#123c2f; font-weight:600; letter-spacing:1px; }
  #exportBtn:hover { background:#186a4c; color:#fff; }
  #status { font-size:11px; color:#3f8f65; text-align:center; margin-top:8px; height:14px; }
  #spec { bottom:16px; left:16px; padding:10px 16px; font-size:11.5px; color:#42536b; letter-spacing:.3px; max-width:640px; line-height:1.7; }
  #spec b { color:#16222f; }
  #hint { position:fixed; bottom:18px; right:20px; font-size:11px; color:#8b99ac; letter-spacing:1px; }
  @media (max-width:760px){ #panel{width:150px} #spec{display:none} #nav{width:140px} }
</style>
</head>

{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ================= 渲染器 / 场景 ================= */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#cfd9e4'); gr.addColorStop(.45,'#e7ecf2'); gr.addColorStop(1,'#eef2f6');
  g.fillStyle = gr; g.fillRect(0,0,4,512);
  const bg = new THREE.CanvasTexture(c); bg.colorSpace = THREE.SRGBColorSpace;
  scene.background = bg;
}
const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.1, 80);
camera.position.set(2.35, 1.52, 3.15);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.60, 0);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 1.0; controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = true; controls.autoRotateSpeed = 1.0;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(3.2, 5.5, 2.8); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left=-3.2; key.shadow.camera.right=3.2;
key.shadow.camera.top=3.4;  key.shadow.camera.bottom=-1.2;
key.shadow.camera.near=1;   key.shadow.camera.far=16;
key.shadow.bias = -0.00018; key.shadow.normalBias = 0.02; key.shadow.radius = 5;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.55); fill.position.set(-3, 2.5, -0.5); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffffff, 0.7);  rim.position.set(-2, 3.5, -4); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

/* ================= 共享材质 ================= */
function noiseRoughTex(base=0.30, vary=0.22, size=256){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d'), img=g.createImageData(size,size), d=img.data;
  let s=12345; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  for(let i=0;i<d.length;i+=4){ const v=(base+rnd()*vary)*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3); return t;
}
const MAT = {
  galv:  new THREE.MeshStandardMaterial({ color:0xc2ccd4, metalness:0.74, roughness:0.34, roughnessMap:noiseRoughTex(0.26,0.2), envMapIntensity:1.35 }),
  galvDark: new THREE.MeshStandardMaterial({ color:0xa5afb7, metalness:0.7, roughness:0.42, roughnessMap:noiseRoughTex(0.32,0.24), envMapIntensity:1.15 }),
  ss:    new THREE.MeshStandardMaterial({ color:0xe8edf1, metalness:0.66, roughness:0.3, roughnessMap:noiseRoughTex(0.24,0.16), envMapIntensity:1.7 }),
  ssDim: new THREE.MeshStandardMaterial({ color:0xccd4da, metalness:0.6, roughness:0.4, roughnessMap:noiseRoughTex(0.3,0.2), envMapIntensity:1.35 }),
  hdpe:  new THREE.MeshPhysicalMaterial({ color:0xf4f5f0, metalness:0, roughness:0.46, clearcoat:0.08, clearcoatRoughness:0.6, envMapIntensity:0.5 }),
  paintBlue: new THREE.MeshPhysicalMaterial({ color:0x1a5da8, metalness:0.25, roughness:0.34, clearcoat:0.65, clearcoatRoughness:0.25, envMapIntensity:0.9 }),
  paintWhite:new THREE.MeshPhysicalMaterial({ color:0xe2e6df, metalness:0.1, roughness:0.42, clearcoat:0.4, clearcoatRoughness:0.4, envMapIntensity:0.75 }),
  black: new THREE.MeshStandardMaterial({ color:0x17181b, metalness:0.15, roughness:0.42, envMapIntensity:0.6 }),
  valve: new THREE.MeshStandardMaterial({ color:0x39404a, metalness:0.75, roughness:0.38, envMapIntensity:0.95 }),
  red:   new THREE.MeshStandardMaterial({ color:0xc22a24, metalness:0.12, roughness:0.5, envMapIntensity:0.6 }),
  yellow:new THREE.MeshStandardMaterial({ color:0xf2a71b, metalness:0.15, roughness:0.5, envMapIntensity:0.7 }),
  motor: new THREE.MeshStandardMaterial({ color:0x3a444e, metalness:0.6, roughness:0.42, envMapIntensity:0.9 }),
  glass: new THREE.MeshPhysicalMaterial({ color:0x3a5a78, metalness:0, roughness:0.08, transmission:0.6, thickness:0.02, envMapIntensity:1 }),
  darkIn:new THREE.MeshStandardMaterial({ color:0x2b2f34, metalness:0.4, roughness:0.8 }),
};

/* ================= 通用铭牌贴图 ================= */
function plateTex(title, lines, accent='#0e62d6', W=560, H=400){
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#f6f7f3'; g.fillRect(0,0,W,H);
  g.strokeStyle='#b9bfc6'; g.lineWidth=4; g.strokeRect(10,10,W-20,H-20);
  g.fillStyle=accent; g.fillRect(10,10,W-20,64);
  g.fillStyle='#fff'; g.font='700 34px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText(title, 32, 54);
  g.fillStyle='#1a2430'; g.font='24px "PingFang SC",sans-serif';
  lines.forEach((t,i)=> g.fillText(t, 32, 118+i*42));
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}

/* ================= 建模工具 ================= */
let ROOT=null; // 当前模型根
function add(geo, mat, x=0,y=0,z=0, opts={}){
  const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true;
  if(opts.ry)m.rotation.y=opts.ry; if(opts.rx)m.rotation.x=opts.rx; if(opts.rz)m.rotation.z=opts.rz;
  if(opts.sy)m.scale.y=opts.sy; if(opts.sx)m.scale.x=opts.sx; if(opts.sz)m.scale.z=opts.sz;
  if(opts.name)m.name=opts.name;
  ROOT.add(m); return m;
}
function tube(a,b,r,mat,seg=10){
  const v1=new THREE.Vector3(...a), v2=new THREE.Vector3(...b);
  const len=v1.distanceTo(v2);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg),mat);
  m.position.copy(v1).add(v2).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), v2.clone().sub(v1).normalize());
  m.castShadow=true; m.receiveShadow=true; ROOT.add(m); return m;
}
const box=(w,h,d,r=0.006)=> r>0 ? new RoundedBoxGeometry(w,h,d,3,r) : new THREE.BoxGeometry(w,h,d);
const cyl=(rt,rb,h,seg=24)=> new THREE.CylinderGeometry(rt,rb,h,seg);
function dome(r, sy=0.5, seg=32){ const m=new THREE.SphereGeometry(r,seg,18,0,Math.PI*2,0,Math.PI/2); m.scale(1,sy,1); return m; }
// 径向接管（沿±x或±z伸出，带法兰）
function nozzle(dir, x,y,z, r, len, mat=MAT.ss, fl=null){
  const g=new THREE.Group();
  const c=new THREE.Mesh(cyl(r,r,len,20),mat);
  if(dir==='x') c.rotation.z=Math.PI/2; if(dir==='z') c.rotation.x=Math.PI/2;
  c.castShadow=c.receiveShadow=true;
  const off = dir==='x'?[len/2,0,0]:dir==='-x'?[-len/2,0,0]:[0,0,len/2];
  c.position.set(x+off[0],y,z+off[2]); ROOT.add(c);
  if(fl){ const f=new THREE.Mesh(cyl(fl,fl,0.018,24),mat);
    if(dir==='x'||dir==='-x') f.rotation.z=Math.PI/2; else f.rotation.x=Math.PI/2;
    const fo=dir==='x'?[len,0,0]:dir==='-x'?[-len,0,0]:[0,0,len];
    f.position.set(x+fo[0],y,z+fo[2]); f.castShadow=true; ROOT.add(f);
  }
  return c;
}
function plate(mat_, w,h, tex, x,y,z, ry=0){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshStandardMaterial({map:tex,roughness:0.55,metalness:0,envMapIntensity:0.4,polygonOffset:true,polygonOffsetFactor:-1}));
  m.position.set(x,y,z); m.rotation.y=ry; ROOT.add(m); return m;
}
// 法兰螺栓圈
function boltRing(x,y,z,axis,R,n,r=0.009){
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2;
    const b=new THREE.Mesh(cyl(r,r,0.03,8),MAT.black);
    if(axis==='x'){ b.position.set(x,y+Math.cos(a)*R,z+Math.sin(a)*R); b.rotation.z=Math.PI/2; }
    else { b.position.set(x+Math.cos(a)*R,y,z+Math.sin(a)*R); b.rotation.x=Math.PI/2; }
    b.castShadow=true; ROOT.add(b);
  }
}

/* ============================================================
   模型 1：IBC 吨桶 1000L
============================================================ */
function buildIBC(){
  const D={palletL:1.20,palletW:1.00,palletH:0.14,cageL:1.16,cageW:0.96,postS:0.042,cageTop:1.17,
           vR:0.0115,railR:0.0155,bottleL:1.06,bottleW:0.86,bottleH:0.96,bottleY:0.14};
  const hx=D.cageL/2,hz=D.cageW/2,px=hx-D.postS/2,pz=hz-D.postS/2;
  // 钢托盘
  add(box(1.20,0.035,1.00,0.012),MAT.galvDark,0,0.1225,0,{name:'pallet_top'});
  add(box(1.20,0.105,0.09,0.008),MAT.galvDark,0,0.0525,0.455);
  add(box(1.20,0.105,0.09,0.008),MAT.galvDark,0,0.0525,-0.455);
  add(box(0.16,0.105,0.82,0.008),MAT.galvDark,0.52,0.0525,0);
  add(box(0.16,0.105,0.82,0.008),MAT.galvDark,-0.52,0.0525,0);
  for(const x of [-0.43,-0.19,0.19,0.43]) add(box(0.05,0.105,0.82,0.006),MAT.galvDark,x,0.0525,0);
  add(box(0.22,0.085,0.80,0),MAT.darkIn,0.31,0.053,0);
  add(box(0.22,0.085,0.80,0),MAT.darkIn,-0.31,0.053,0);
  for(const sx of[-1,1])for(const sz of[-1,1]) add(box(0.075,0.016,0.075,0.005),MAT.galv,sx*px,0.148,sz*pz);
  // 钢管框架
  const yBot=0.155,yTop=D.cageTop,vx=0.469;
  for(const sx of[-1,1])for(const sz of[-1,1]){
    add(box(D.postS,yTop-0.148,D.postS,0.008),MAT.galv,sx*px,(0.148+yTop)/2+0.003,sz*pz,{name:'post'});
    add(box(D.postS+0.012,0.012,D.postS+0.012,0.004),MAT.galv,sx*px,yTop+0.006,sz*pz);
    add(cyl(0.008,0.008,0.014,8),MAT.black,sx*px,0.162,sz*pz);
  }
  for(const y of [0.34,0.58,0.82,1.04]){
    tube([-px,y,vx],[px,y,vx],D.railR,MAT.galv);
    tube([-px,y,-vx],[px,y,-vx],D.railR,MAT.galv);
    tube([hx-0.011,y,-vx],[hx-0.011,y,vx],D.railR,MAT.galv);
    tube([-hx+0.011,y,-vx],[-hx+0.011,y,vx],D.railR,MAT.galv);
  }
  tube([-px,yTop,vx],[px,yTop,vx],D.railR,MAT.galv);
  tube([-px,yTop,-vx],[px,yTop,-vx],D.railR,MAT.galv);
  tube([hx-0.011,yTop,-vx],[hx-0.011,yTop,vx],D.railR,MAT.galv);
  tube([-hx+0.011,yTop,-vx],[-hx+0.011,yTop,vx],D.railR,MAT.galv);
  tube([-0.33,yTop,-vx],[-0.33,yTop,vx],D.railR,MAT.galv);
  tube([0.33,yTop,-vx],[0.33,yTop,vx],D.railR,MAT.galv);
  for(let i=-5;i<=5;i++){ const x=i*0.10; if(Math.abs(x)>px-0.03)continue;
    tube([x,yBot,-vx],[x,yTop,-vx],D.vR,MAT.galv);
    if(!(Math.abs(x-0.35)<0.09)) tube([x,yBot,vx],[x,yTop,vx],D.vR,MAT.galv);
  }
  for(let i=-4;i<=4;i++){ const z=i*0.105; if(Math.abs(z)>pz-0.05)continue;
    tube([px+0.005,yBot,z],[px+0.005,yTop,z],D.vR,MAT.galv);
    tube([-px-0.005,yBot,z],[-px-0.005,yTop,z],D.vR,MAT.galv);
  }
  // HDPE 内胆
  add(new RoundedBoxGeometry(D.bottleL,D.bottleH,D.bottleW,5,0.055),MAT.hdpe,0,D.bottleY+D.bottleH/2,0,{name:'bottle'});
  add(cyl(0.105,0.115,0.045,28),MAT.hdpe,-0.16,1.123,0.06,{name:'fill_neck'});
  add(cyl(0.100,0.100,0.020,32),MAT.black,-0.16,1.148,0.06);
  const kn=add(cyl(0.096,0.096,0.026,28),MAT.black,-0.16,1.171,0.06);
  add(cyl(0.082,0.090,0.010,28),MAT.black,-0.16,1.189,0.06);
  add(cyl(0.050,0.058,0.040,24),MAT.hdpe,0.30,1.118,0.20);
  add(cyl(0.046,0.046,0.024,24),MAT.black,0.30,1.148,0.20);
  add(cyl(0.020,0.020,0.014,16),MAT.red,0.30,1.164,0.20);
  add(box(0.18,0.02,0.03,0.008),MAT.galvDark,0.35,0.155,0.425);
  // DN50 放料阀
  const X=0.35,Y=0.235,Z0=0.43;
  add(cyl(0.062,0.068,0.022,26),MAT.valve,X,Y,Z0+0.011,{rx:Math.PI/2});
  add(cyl(0.040,0.040,0.048,20),MAT.valve,X,Y,Z0+0.046,{rx:Math.PI/2});
  add(box(0.105,0.115,0.075,0.02),MAT.valve,X,Y,Z0+0.105,{name:'valve_body'});
  add(cyl(0.055,0.055,0.014,24),MAT.galv,X,Y,Z0+0.075,{rx:Math.PI/2});
  add(cyl(0.055,0.055,0.014,24),MAT.galv,X,Y,Z0+0.135,{rx:Math.PI/2});
  add(box(0.17,0.013,0.022,0.005),MAT.red,X+0.105,Y+0.062,Z0+0.105,{name:'handle'});
  add(box(0.05,0.02,0.026,0.008),MAT.black,X+0.20,Y+0.062,Z0+0.105);
  add(cyl(0.032,0.032,0.06,18),MAT.valve,X,Y,Z0+0.160,{rx:Math.PI/2});
  const R=0.042;
  add(new THREE.TorusGeometry(R,0.030,12,18,Math.PI/2),MAT.valve,X,Y-R,Z0+0.145+R,{ry:-Math.PI/2});
  add(cyl(0.030,0.030,0.105,18),MAT.valve,X,Y-0.0525,Z0+0.145+2*R);
  add(cyl(0.036,0.036,0.015,18),MAT.galv,X,0.112,Z0+0.145+2*R);
  // 标签
  plate(MAT.hdpe,0.62,0.455,plateTex('IBC 吨桶 · 1000 L',[
    'UN 31H1 / Y1.8 / 150','内容器：HDPE | 框架：镀锌钢',
    '外形 1200×1000×1160 mm','自重 ≈ 62 kg  满载 ≈ 1062 kg',
    '灌装口 DN150 · 放料阀 DN50']),-0.02,0.74,0.4338);
  plate(MAT.hdpe,0.62,0.455,plateTex('IBC 吨桶 · 1000 L',[
    'UN 31H1 / Y1.8 / 150','内容器：HDPE | 框架：镀锌钢',
    '外形 1200×1000×1160 mm','自重 ≈ 62 kg  满载 ≈ 1062 kg',
    '灌装口 DN150 · 放料阀 DN50']),-0.02,0.74,-0.4338,Math.PI);
}

/* ============================================================
   模型 2：200L 闭口钢桶
============================================================ */
function buildDrum(){
  const r=0.286, bodyH=0.80, y0=0.04;
  add(cyl(r,r,bodyH,48),MAT.paintBlue,0,y0+bodyH/2,0,{name:'drum_body'});
  // 上下卷边
  add(new THREE.TorusGeometry(r-0.012,0.016,12,48),MAT.paintBlue,0,y0+bodyH,0,{rx:Math.PI/2});
  add(new THREE.TorusGeometry(r-0.012,0.016,12,48),MAT.paintBlue,0,y0,0,{rx:Math.PI/2});
  add(cyl(r-0.012,r-0.012,0.010,48),MAT.paintBlue,0,y0+bodyH+0.008,0);

/* nozzle 垂直方向支持 */
function nozzleY(x,y,z,r,len,mat,fl){
  const c=new THREE.Mesh(cyl(r,r,len,18),mat); c.position.set(x,y+Math.sign(len)*len/2,z);
  c.castShadow=c.receiveShadow=true; ROOT.add(c);
  if(fl){ const f=new THREE.Mesh(cyl(fl,fl,0.016,20),mat); f.position.set(x,y+Math.sign(len)*len,z); f.castShadow=true; ROOT.add(f); }
}
{ // 用真正的垂直接管替换占位
  const _o=nozzle; nozzle=function(dir,x,y,z,r,len,mat,fl){
    if(dir==='y_up'||dir==='y_dn'){ nozzleY(x,y,z,r,len,mat,fl); return; }
    _o(dir,x,y,z,r,len,mat,fl);
  };
}

  { id:'reactor', name:'搅拌反应釜', sub:'500L', build:buildReactor, cam:{pos:[2.7,2.1,3.5],tgt:[0,1.15,0]},
    spec:'外形 <b>Φ1100×1500 mm</b> · 容积 <b>500 L</b> · 夹套 0.6MPa · 电机+减速机 2.2kW · 锚式搅拌 · 视镜/人孔 · 底部卸料球阀' },
  { id:'pump', name:'离心泵机组', sub:'IH50', build:buildPump, cam:{pos:[1.55,0.95,2.05],tgt:[0,0.42,0]},
    spec:'型号 <b>IH50-32-160</b> · 流量 12.5 m³/h · 扬程 32 m · 电机 3kW/2900rpm · 联轴器黄色护罩 · 共用底座' },
  { id:'hx', name:'列管换热器', sub:'BEM400', build:buildHX, cam:{pos:[2.3,1.05,3.1],tgt:[0,0.55,0]},
    spec:'型式 <b>BEM</b> · 换热面积 <b>12 m²</b> · 管/壳程 0.6MPa · 前后管箱+法兰螺栓圈 · 双鞍座 · 吊耳 · S30408' },
];
let current=null, currentDef=null, tween=null;

function disposeModel(g){
  g.traverse(o=>{ if(o.isMesh){ o.geometry.dispose(); } });
  scene.remove(g);
}
function switchModel(id, keepCam=false){
  const def=MODELS.find(m=>m.id===id); if(!def) return;
  if(current) disposeModel(current);
  ROOT=new THREE.Group(); ROOT.name=def.name;
  def.build(); scene.add(ROOT);
  current=ROOT; currentDef=def;
  document.getElementById('spec').innerHTML=def.spec;
  if(!keepCam){
    tween={t:0,p0:camera.position.clone(),p1:new THREE.Vector3(...def.cam.pos),
           q0:controls.target.clone(),q1:new THREE.Vector3(...def.cam.tgt)};
  }
  // 更新导航高亮
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
}
// 导航 UI
const nav=document.getElementById('nav');
for(const m of MODELS){
  const b=document.createElement('button');
  b.dataset.id=m.id; b.innerHTML=`<span>${m.name}</span><small>${m.sub}</small>`;
  b.onclick=()=>switchModel(m.id);
  nav.appendChild(b);
}

/* ================= UI 交互 ================= */
document.getElementById('btnRotate').classList.add('on');
document.getElementById('btnRotate').onclick=(e)=>{
  controls.autoRotate=!controls.autoRotate; e.target.classList.toggle('on',controls.autoRotate);
};
let wire=false;
document.getElementById('btnWire').onclick=(e)=>{
  wire=!wire; e.target.classList.toggle('on',wire);
  if(current) current.traverse(o=>{ if(o.isMesh&&o.material&&!o.material.map) o.material.wireframe=wire; });
};
const status=document.getElementById('status');
document.getElementById('exportBtn').onclick=()=>{
  if(!currentDef) return;
  status.textContent='正在生成 GLB…';
  new GLTFExporter().parse(current,(buf)=>{
    const blob=new Blob([buf],{type:'model/gltf-binary'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=currentDef.id+'.glb'; a.click(); URL.revokeObjectURL(a.href);
    status.textContent='✓ 已导出 '+currentDef.name;
    setTimeout(()=>status.textContent='',2400);
  },(err)=>{status.textContent='导出失败';console.error(err);},{binary:true});
};

/* ================= 循环 ================= */
switchModel('ibc');
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  if(tween){
    tween.t=Math.min(1,tween.t+dt/0.85);
    const k=1-Math.pow(1-tween.t,3);
    camera.position.lerpVectors(tween.p0,tween.p1,k);
    controls.target.lerpVectors(tween.q0,tween.q1,k);
    if(tween.t>=1)tween=null;
  }
  controls.update();
  renderer.render(scene,camera);
}
animate();
window.__dbg={THREE,scene,camera,renderer,get current(){return ROOT},MODELS,switchModel};
window.__modelReady=true;
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
